{% extends "base.html" %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-lg-9">
<div class="card border-0 shadow-lg rounded-4">
  <div class="card-header bg-dark text-white p-4 rounded-top-4">
    <h3 class="fw-bold mb-1">{{ skill }} Test</h3>
    <p class="mb-0 text-white-50">{{ questions|length }} questions &bull; {{ label }}</p>
  </div>
  <div class="card-body p-4 p-md-5">
  <form method="POST"><input type="hidden" name="quiz_id" value="{{ quiz_id }}">
    {% for q in questions %}
    <div class="mb-4 pb-3 border-bottom">
      <h5 class="fw-bold text-dark mb-3"><span class="badge bg-primary me-2">{{ q.level }}</span>{{ loop.index }}. {{ q.question }}</h5>
      {% for opt in q.options %}
      <div class="form-check mb-2">
        <input class="form-check-input" type="radio" name="q_{{ q.id }}" id="q{{ q.id }}_{{ loop.index }}" value="{{ opt }}" required>
        <label class="form-check-label" for="q{{ q.id }}_{{ loop.index }}">{{ opt }}</label>
      </div>
      {% endfor %}
    </div>
    {% endfor %}
    <div class="d-grid"><button class="btn btn-primary btn-lg rounded-pill fw-bold" style="background:#4f46e5;border:none" type="submit">Submit & Get Gemini Analysis</button></div>
  </form></div></div></div></div></div>
{% endblock %}
